# MJC-READY 개발기 미리보기 배포 — main push 시 GitHub Pages 자동 배포.
# 배포 URL: https://monatory.github.io/mjc-jobready-pwa/
#
# ⚠ 2026-08-30부터 클라우드 모드(Firestore 실명 수집) 가동 중 — "서버 전송 없음이라 공개 무해"
# 전제는 더 이상 유효하지 않다. 개인정보 보호는 Firestore Security Rules + Auth가 담당하며,
# 규칙 변경 시 반드시 콘솔 게시까지 완료할 것 (CLAUDE.md §7.2).

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # npm install 폴백 금지 — lockfile 불일치를 조용히 우회해 로컬과 다른 의존성으로
        # 빌드된 번들이 라이브에 올라가는 것을 차단 (감사 EXT-02)
        run: npm ci

      - name: Validate data integrity (배점·참조 무결성 53건)
        run: npm run validate:data

      - name: Run regression tests (판정엔진 15건)
        run: npm test

      - name: Build (tsc + Vite)
        env:
          GITHUB_PAGES: "1"
        run: npm run build

      - name: Setup Pages (최초 1회 자동 활성화)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
